name: collect

# 22:30 UTC = 07:30 KST (미국 마감 20:00/21:00 UTC 이후, 서머타임 무관). 01:00 UTC 는 FRED 반영 지연 대비 재시도.
# 주말·휴장일에도 돌며 unchanged 로 정상 종료한다.
# 주의: GitHub 는 공개 레포가 60일간 저장소 활동(커밋 등)이 없으면 스케줄 워크플로를 끈다. 워크플로 실행 자체는 활동으로 치지 않는다
#       → 마지막 단계(keepalive)가 마지막 커밋이 50일을 넘으면 빈 커밋을 push 한다. 그래도 멈추면 healthchecks 데드맨 핑으로 감지.
on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      keepalive_days:
        description: '마지막 커밋이 이 일수 이상 지났으면 빈 커밋을 push (기본 50, 0 이면 시험으로 바로 push)'
        required: false
        default: '50'

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # keepalive 의 빈 커밋 push 에만 쓴다. 캐시·아티팩트는 GITHUB_TOKEN 권한이 필요 없다.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      # 관측 누적(fg/history.json)과 소스 캐시를 실행 간에 유지한다. 실패한 실행의 관측값도 남겨야 하므로 restore/save 를 분리해 항상 저장한다.
      - uses: actions/cache/restore@v4
        id: restore-cache
        with:
          path: proxy/.cache
          key: rfg-cache-${{ github.run_id }}
          restore-keys: |
            rfg-cache-
      - name: Download previous publish (for partial fallback)
        continue-on-error: true
        run: |
          mkdir -p public/v1
          curl -fsSL "https://${PAGES_HOST}/v1/snapshot.json" -o public/v1/snapshot.json || true
          # 이력은 두 지수가 모두 새로 계산될 때만 바뀐다 — 실패한 날 배포가 이전 이력을 지우지 않도록 받아 둔다
          curl -fsSL "https://${PAGES_HOST}/v1/history.json" -o public/v1/history.json || true
        env:
          PAGES_HOST: ${{ vars.PAGES_HOST }}
      - name: Collect
        id: collect
        run: npx tsx src/cli.ts collect --out ./public --data ./.cache
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          CNN_USER_AGENT: ${{ vars.CNN_USER_AGENT }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: proxy/.cache
          key: rfg-cache-${{ github.run_id }}
      # 웹 화면(web/ → index.html·app.js·style.css). 수집이 실패한 날에도 화면은 이전 데이터로 게시한다.
      - name: Build web
        if: always()
        run: npm run build-web
      # 실패한 실행도 status.json 은 게시한다(snapshot.json 은 검증 통과 시에만 바뀌므로 안전).
      # Cloudflare Workers 정적 자산으로 게시한다(proxy/wrangler.jsonc, 코드 없이 public/ 만 서빙).
      # Cloudflare Pages 는 Workers 로 통합되는 중이라(2026) 새로 만들지 않았다. 변수 이름 PAGES_* 는 그대로 쓴다.
      - name: Deploy to Cloudflare (Workers static assets)
        if: ${{ always() && vars.PAGES_PROJECT != '' }}
        run: npx wrangler deploy --name "${PAGES_PROJECT}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ github.run_id }}
          path: proxy/public/v1/status.json
          if-no-files-found: ignore
      # 수집이 실패한 날에도 돈다 — 예약 실행 자체가 꺼지는 것을 막는 게 목적이다. push 가 실패해도 잡은 실패시키지 않고 경고만 남긴다.
      - name: Keepalive (no commit for 50 days → empty commit)
        if: always()
        working-directory: .
        env:
          KEEPALIVE_DAYS: ${{ inputs.keepalive_days || '50' }}
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last) / 86400 ))
          echo "last commit ${age_days} days ago (threshold ${KEEPALIVE_DAYS})"
          if [ "$age_days" -ge "$KEEPALIVE_DAYS" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (예약 실행 유지, 마지막 커밋 ${age_days}일 전)"
            git push || echo "::warning::keepalive push failed"
          fi

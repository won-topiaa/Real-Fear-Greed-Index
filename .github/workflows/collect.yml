name: collect

# GitHub 는 예약 실행을 매일 2~6시간 늦게 돌리고, 부하가 크면 건너뛰기도 한다(2026-09~10 측정: 22:30 → 00:13~03:06Z,
# 정각 01:00 → 05:13~07:10Z). 그래서 정각을 피한 시각 여러 개에 건다 — 수집은 같은 날 몇 번 돌아도 결과가 같고(unchanged)
# 30초 남짓이라, 가장 먼저 도는 실행이 갱신하고 나머지는 예비가 된다. 늦게 도는 실행은 CNN 잠정치도 새로 받는다.
#   22:23Z 본실행(나스닥 100 공식 종가 17:15 ET 뒤 — EDT 18:23·EST 17:23 ET) · 23:53Z · 00:37Z · 01:23Z 예비
#   03:53Z FRED NASDAQ100 반영(≈ 03:37Z) 뒤 · 05:37Z · 07:23Z 늦은 예비(게시 점검이 이때부터 '종가 12시간 경과'로 오류를 낸다) · 10:07Z
#   (2026-10-18~20 실측: 22:23 → 00:06~01:06Z, 23:53 → 01:35~02:11Z, 01:23 → 06:04~06:19Z, 03:53 → 08:21~09:20Z, 07:23 → 12:06~14:45Z)
# 예약 실행이 통째로 멈추는 날을 위해 GitHub 밖의 감시 워커(proxy/watchdog/, Cloudflare 매시 cron)가 게시본이 늦으면 이 워크플로를 직접 돌린다.
# FRED 가 늦는 지수는 같은 실행에서 Yahoo(전용 프록시 → 예비 프록시)로 채우고, Yahoo 도 안 되면 wait-for-fred 잡이 FRED 를 기다린다.
# 매 실행 끝의 게시 점검(Freshness check)이 종가 12시간 뒤에도 늦은 지수가 있으면 실패해 GitHub 실패 메일로 알린다.
# 주말·휴장일에도 돌며 unchanged 로 정상 종료한다.
# 주의: GitHub 는 공개 레포가 60일간 저장소 활동(커밋 등)이 없으면 스케줄 워크플로를 끈다. 워크플로 실행 자체는 활동으로 치지 않는다
#       → 마지막 단계(keepalive)가 마지막 커밋이 50일을 넘으면 빈 커밋을 push 한다. 그래도 멈추면 감시 워커가 직접 돌린다.
on:
  schedule:
    - cron: '23 22 * * *'
    - cron: '53 23 * * *'
    - cron: '37 0 * * *'
    - cron: '23 1 * * *'
    - cron: '53 3 * * *'
    - cron: '37 5 * * *'
    - cron: '23 7 * * *'
    - cron: '7 10 * * *'
  workflow_dispatch:
    inputs:
      keepalive_days:
        description: '마지막 커밋이 이 일수 이상 지났으면 빈 커밋을 push (기본 50, 0 이면 시험으로 바로 push)'
        required: false
        default: '50'

jobs:
  collect:
    runs-on: ubuntu-latest
    # 수집·게시만 한 번에 하나씩. 실행 전체가 아니라 이 잡에만 건다 — wait-for-fred 가 몇 시간 기다리는 동안
    # 다른 실행(예비 예약 등)의 수집까지 막지 않게(2026-10-17 시험에서 01:00 실행이 3시간 묶였다).
    concurrency:
      group: collect
      cancel-in-progress: false
    # FRED 가 아직 하루 전 값까지만 준 지수(예: NDX) — 있으면 wait-for-fred 잡이 돈다
    outputs:
      lagging: ${{ steps.collect.outputs.lagging }}
      expected: ${{ steps.collect.outputs.expected }}
    # contents: keepalive 빈 커밋 push. pages·id-token: GitHub Pages 게시. 캐시·아티팩트는 GITHUB_TOKEN 권한이 필요 없다.
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      # 관측 누적(fg/history.json)과 소스 캐시를 실행 간에 유지한다. 실패한 실행의 관측값도 남겨야 하므로 restore/save 를 분리해 항상 저장한다.
      # v2: FG 병합 규칙 변경(CNN 확정값 우선, 2026-10-15) — 예전 캐시의 잠정치를 버리고 CNN 이력을 처음부터 다시 받는다.
      - uses: actions/cache/restore@v4
        id: restore-cache
        with:
          path: proxy/.cache
          key: rfg-cache-v2-${{ github.run_id }}
          restore-keys: |
            rfg-cache-v2-
      - name: Download previous publish (for partial fallback)
        continue-on-error: true
        run: |
          mkdir -p public/v1
          curl -fsSL "https://${PAGES_HOST}/v1/snapshot.json" -o public/v1/snapshot.json || true
          # 이력은 지수마다 이어 쓴다(실패한 지수는 이전 이력) — 실패한 날 배포가 이전 이력을 지우지 않도록 받아 둔다
          curl -fsSL "https://${PAGES_HOST}/v1/history.json" -o public/v1/history.json || true
        env:
          PAGES_HOST: ${{ vars.PAGES_HOST }}
      - name: Collect
        id: collect
        run: npx tsx src/cli.ts collect --out ./public --data ./.cache
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          # 야후 프록시(Cloudflare Worker). 주소에 계정 하위 도메인(실명)이 있어 Secret 으로만 둔다
          YAHOO_PROXY_URL: ${{ secrets.YAHOO_PROXY_URL }}
          CNN_USER_AGENT: ${{ vars.CNN_USER_AGENT }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: proxy/.cache
          key: rfg-cache-v2-${{ github.run_id }}
      # 웹 화면(web/ → index.html·app.js·style.css). 수집이 실패한 날에도 화면은 이전 데이터로 게시한다.
      - name: Build web
        if: always()
        run: npm run build-web
      # GitHub Pages 로 게시한다(https://won-topiaa.github.io/Real-Fear-Greed-Index/, 2026-10-15 Cloudflare 에서 이전 —
      # 계정 하위 도메인에 실명이 들어가서). 실패한 실행도 status.json 은 게시한다(snapshot.json 은 검증 통과 시에만 바뀜).
      # Pages 는 _headers 를 읽지 않는다: 캐시는 GitHub 기본(max-age=600), CORS 는 기본으로 * 이다.
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: proxy/public
      # Pages 배포는 가끔 일시 오류로 실패한다 — 실패하면 1분 뒤 한 번 더(두 번째도 실패하면 잡 실패 → 메일)
      - name: Deploy to GitHub Pages
        id: deployment
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before Pages retry
        if: always() && steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: always() && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ github.run_id }}
          path: proxy/public/v1/status.json
          if-no-files-found: ignore
      # 갱신 지연이 반복돼도 조용히 넘어가지 않게(src/check.ts): 기대 거래일 종가 12시간 뒤(EDT 08:00Z)에도 하루 이상 늦은
      # 지수가 있으면 실패한다 → GitHub 실패 메일. 그 전에는 경고만. 소스 실패·프록시 미설정·휴장일 목록 만료도 경고로 남긴다.
      - name: Freshness check
        if: always()
        run: npx tsx src/cli.ts check --out ./public
        env:
          YAHOO_PROXY_URL: ${{ secrets.YAHOO_PROXY_URL }}
      # 수집이 실패한 날에도 돈다 — 예약 실행 자체가 꺼지는 것을 막는 게 목적이다. push 가 실패해도 잡은 실패시키지 않고 경고만 남긴다.
      - name: Keepalive (no commit for 50 days → empty commit)
        if: always()
        working-directory: .
        env:
          KEEPALIVE_DAYS: ${{ inputs.keepalive_days || '50' }}
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last) / 86400 ))
          echo "last commit ${age_days} days ago (threshold ${KEEPALIVE_DAYS})"
          if [ "$age_days" -ge "$KEEPALIVE_DAYS" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (예약 실행 유지, 마지막 커밋 ${age_days}일 전)"
            git push || echo "::warning::keepalive push failed"
          fi

  # 본실행에서 FRED 가 하루 전 값까지만 준 지수가 있으면 FRED 최신 관측일만 10분마다 확인하고, 올라오면 수집 워크플로를
  # 새로 한 번 돌린다(workflow_dispatch 는 GITHUB_TOKEN 으로도 새 실행이 생긴다). 야후(프록시)가 그 지수를 채운 날에는 돌지 않는다.
  # 이 잡은 concurrency 밖이라 기다리는 동안 다른 실행의 수집을 막지 않는다. 두 지수가 다 늦었으면 먼저 올라온 쪽으로 다시 돌고, 나머지는 그 실행의 이 잡이 다시 기다린다.
  # 기다림은 기대 거래일 종가 16시간 뒤(EDT 12:00Z)·최대 5시간까지 — 그때까지 안 오면 경고를 남기고 다음 예약 실행에 맡긴다.
  # 한 번에 하나만: 예약 실행이 여러 개라 대기 잡이 겹치면 새 것이 이전 것을 취소한다(같은 FRED 를 기다리므로).
  wait-for-fred:
    needs: collect
    if: ${{ !cancelled() && needs.collect.outputs.lagging != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: wait-for-fred
      cancel-in-progress: true
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - name: Wait for FRED
        id: wait
        run: npx tsx src/cli.ts wait --symbols "$LAGGING" --expected "$EXPECTED"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LAGGING: ${{ needs.collect.outputs.lagging }}
          EXPECTED: ${{ needs.collect.outputs.expected }}
      - name: Re-run collect
        if: steps.wait.outputs.ready != ''
        run: gh workflow run collect.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

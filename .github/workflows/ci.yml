name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/doctor.mjs
      - run: npm run typecheck
      - run: npm test -- --ci
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 웹 화면 타입 검사 + 번들(web/ 가 src/core·src/text 를 그대로 쓴다)
      - run: npm run build-web
